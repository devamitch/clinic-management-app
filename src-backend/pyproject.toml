[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "src-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sanic>=25.3.0",
    "sqlalchemy>=2.0.41",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.14.1",
]

[tool.setuptools]
py-modules = ["main", "run"]
